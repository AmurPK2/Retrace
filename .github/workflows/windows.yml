name: Windows desktop
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache-dependency-path: phone-gateway/go.sum
      - run: npm ci
      - run: npm run phone:build
      - run: npm run build
      - run: npm test
      - run: node node_modules/electron-builder/cli.js --win zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: RETRACE-Windows
          path: release/*.zip
